name: Deploy Tic Tac Toe Site

on:
  push:
    branches:
      - main   # जब main branch पर push होगा

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js (optional if JS project)
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Build project
        run: |
          echo "No build step needed for static HTML"
          # अगर build step है तो यहाँ डालो

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./   # यहाँ वो folder डालो जहाँ index.html है
